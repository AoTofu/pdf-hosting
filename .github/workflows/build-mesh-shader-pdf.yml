name: Build mesh shader PDF

on:
  push:
    paths:
      - ".mesh_shader_upload/READY"

permissions:
  contents: write

jobs:
  build:
    if: ${{ contains(github.event.head_commit.added, '.mesh_shader_upload/READY') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct LaTeX source
        shell: bash
        run: |
          cat .mesh_shader_upload/part*.b64 | base64 -d > mesh_shader_intro.tex.gz
          echo "85df9744d2657daa3df250c405d4514323a6a00880015a8e7068bcac2bf2c2e3  mesh_shader_intro.tex.gz" | sha256sum -c -
          gzip -d mesh_shader_intro.tex.gz
          echo "575a1f2f5fc74b2b8bbe27677ee361864b111da3fc32e721b9573f019ed0ed7b  mesh_shader_intro.tex" | sha256sum -c -

      - name: Install TeX Live packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-lang-japanese \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended

      - name: Build PDF
        shell: bash
        run: |
          uplatex -interaction=nonstopmode -halt-on-error mesh_shader_intro.tex
          uplatex -interaction=nonstopmode -halt-on-error mesh_shader_intro.tex
          dvipdfmx -o mesh_shader_intro.pdf mesh_shader_intro.dvi
          test -s mesh_shader_intro.pdf
          pdfinfo mesh_shader_intro.pdf | grep -q "Pages:.*125"

      - name: Commit PDF and remove staging data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesh_shader_intro.pdf
          git rm -r .mesh_shader_upload
          git commit -m "Add Mesh Shader introduction PDF"
          git push
