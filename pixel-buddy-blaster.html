// Tap/click handling. Returns true if handled here
function handleTap(x, y) {

  switch (G.state) {

window.addEventListener('pointerdown', (e) => {

window.addEventListener('keydown', (e) => {

// ---- Waves ----

    rows.forEach((row, r) => {
      const off = ((cols - row.length) * sx) / 2;
      [...row].forEach((ch, c) => {
        const type = FORMATION_KEYS[ch];
        if (!type) return;
        spawnEnemy(type, { mode: 'form', slotX: off + c * sx, slotY: r * sy, x: f.x + off + c * sx, y: f.y + r * sy });

      break;
    case 'hop': // mini slime
      e.vy = Math.min(e.vy + 150 * dt, 70 * d.speed);
      e.x += e.vx * dt; e.y += e.vy * dt;
      if ((e.x < 6 && e.vx < 0) || (e.x > W - 6 && e.vx > 0)) e.vx *= -1;
      if (e.y > H + 10) e.gone = true;
      break;
  }
}

function damageEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.08;
  if (e.hp <= 0) killEnemy(e, false);
  else Sound.sfx('hit');
}
function killEnemy(e, silent) {
  const T = ENEMY_TYPES[e.type];
  e.dead = true;
  addScore(Math.round(T.score * (1 + G.course * 0.2)));
  explode(e.x, e.y, T.colors, e.type === 'rock' ? 20 : 14, 75);
  if (!silent) Sound.sfx('explode');
  shakeScreen(e.type === 'rock' ? 3 : 1.5);
  G.courseKills++;
  if (T.split) {
    for (const s of [-1, 1]) spawnEnemy(T.split, { mode: 'hop', x: e.x + s * 4, y: e.y, vx: s * rand(35, 55), vy: -60, minion: e.minion });
  }
  if (G.phase !== 'bossDead') maybeDrop(e.x, e.y, e.minion ? 0.5 : 1);
}

// ---- Items ----
function maybeDrop(x, y, mult) {
  G.killsSinceDrop++;
  if (Math.random() < CONFIG.items.dropChance * mult || G.killsSinceDrop >= CONFIG.items.pityKills) {
    G.killsSinceDrop = 0;
    G.items.push({ type: pickItemType(), x, y, t: 0 });
  }
}
function pickItemType() {
  const p = G.player, entries = [];
  let total = 0;
  for (const k in ITEM_TYPES) {
    let wt = ITEM_TYPES[k].weight;
    if (k === 'weapon' && p.weapon >= 3) wt *= 0.3;
    if (k === 'weapon' && p.weapon === 0) wt *= 1.6;
    if (k === 'rapid' && p.rapid >= 3) wt *= 0.3;
    if (k === 'speed' && p.speedLv >= 2) wt *= 0.3;
    if (k === 'life' && p.lives >= CONFIG.player.maxLives) wt = 0;
    if (k === 'shield' && p.shield) wt *= 0.4;
    entries.push([k, wt]); total += wt;
  }
  let r = Math.random() * total;
  for (const [k, wt] of entries) { if ((r -= wt) <= 0) return k; }
  return 'weapon';
}
function applyItem(it) {
  const p = G.player, B = CONFIG.scoring.maxBonus;
  let label = ITEM_TYPES[it.type].label, snd = 'item';
  const bonus = () => { addScore(B, true); label = 'MAX! +' + B; };
  switch (it.type) {
    case 'weapon': if (p.weapon < 3) { p.weapon++; label = WEAPON_NAMES[p.weapon] + (p.weapon === 3 ? '!!' : '!'); snd = 'power'; } else bonus(); break;
    case 'rapid': if (p.rapid < 3) { p.rapid++; label = 'RAPID UP'; snd = 'power'; } else bonus(); break;
    case 'speed': if (p.speedLv < 2) { p.speedLv++; label = 'SPEED UP'; snd = 'power'; } else bonus(); break;
    case 'shield': p.shield = true; snd = 'shield'; break;
    case 'life': if (p.lives < CONFIG.player.maxLives) { p.lives++; snd = 'oneup'; } else bonus(); break;
    case 'bomb': doBomb(); snd = null; break;
    case 'star': p.star = CONFIG.items.starTime; snd = 'star'; break;
    case 'x2': p.x2 = CONFIG.items.x2Time; break;
  }
  if (snd) Sound.sfx(snd);
  addFloat(label, p.x, p.y - 18, ITEM_TYPES[it.type].color === '#57606F' ? '#FFFFFF' : mix(ITEM_TYPES[it.type].color, '#FFFFFF', 0.35));
  sparkle(p.x, p.y, ['#FFFFFF', '#FFE14D', ITEM_TYPES[it.type].color], 16, 70);
}
function doBomb() {
  Sound.sfx('bomb');
  G.flashT = 0.35; shakeScreen(8);
  for (const b of G.enemyBullets) { sparkle(b.x, b.y, ['#FFFFFF', '#FFE14D'], 2, 30); addScore(10); }
  G.enemyBullets = [];
  for (const e of G.enemies) if (!e.dead && e.y > -8) damageEnemy(e, 10);
  if (G.boss && G.phase === 'boss' && !G.boss.entering) damageBoss(G.boss, 15);
}

// ---- Player ----
function updatePlayer(dt) {
  const p = G.player, P = Input.pointer;
  let dir = 0;
  if (Input.left()) dir -= 1;
  if (Input.right()) dir += 1;
  if (P.active && !P.dragged) dir = P.x < W / 2 ? -1 : 1;
  p.x += dir * CONFIG.player.speeds[p.speedLv] * dt;
  if (P.dragDX) { p.x += P.dragDX; P.dragDX = 0; }
  p.x = clamp(p.x, 12, W - 12);
  p.moving = dir !== 0 || (P.active && P.dragged);
  p.anim += dt;
  if (p.inv > 0) p.inv -= dt;
  if (p.star > 0) { p.star -= dt; if (Math.random() < 0.5) sparkle(p.x + rand(-10, 10), p.y + rand(-8, 8), ['#FFFFFF', '#FFE14D', '#FF8CC6', '#4FC3FF'], 1, 20); }
  if (p.x2 > 0) p.x2 -= dt;
  p.fireCd -= dt;
  const firing = Input.keys.Space || G.autoFire || (P.active && P.type === 'mouse');
  if (firing && p.fireCd <= 0 && G.phase !== 'bossDead') {
    firePlayer();
    p.fireCd = CONFIG.player.fireIntervals[p.rapid];
  }
}
function firePlayer() {
  const p = G.player, lv = p.weapon, y = p.y - 10;
  const shot = (x, ang, o = {}) => {
    const s = o.speed || CONFIG.player.bulletSpeed;
    G.bullets.push({ x, y, vx: Math.sin(ang) * s, vy: -Math.cos(ang) * s, w: o.w || 2, h: o.h || 6, dmg: o.dmg || 1, pierce: !!o.pierce, hit: o.pierce ? new Set() : null, kind: o.kind || 'shot', dead: false });
  };
  if (lv === 0) shot(p.x, 0);
  else if (lv === 1) { shot(p.x - 4, -0.06); shot(p.x + 4, 0.06); }
  else if (lv === 2) { shot(p.x, 0); shot(p.x - 3, -0.22); shot(p.x + 3, 0.22); }
  else { shot(p.x, 0, { kind: 'laser', w: 3, h: 16, pierce: true, dmg: 1.5, speed: CONFIG.player.laserSpeed }); shot(p.x - 5, -0.18); shot(p.x + 5, 0.18); }
  Sound.sfx(lv === 3 ? 'laser' : 'shoot');
}
function hurtPlayer() {
  const p = G.player;
  if (G.state !== 'play' || G.phase === 'dying' || p.dead || p.inv > 0 || p.star > 0) return;
  if (p.shield) {
    p.shield = false; p.inv = 1.2;
    Sound.sfx('shieldBreak');
    explode(p.x, p.y, ['#7FDBFF', '#FFFFFF'], 16, 90);
    addFloat('SHIELD BREAK', p.x, p.y - 18, '#7FDBFF');
    shakeScreen(3);
    return;
  }
  p.lives--; G.courseHits++;
  const hadPower = p.weapon > 0;
  p.weapon = Math.max(0, p.weapon - 1); // weapon level drops by one when hit
  shakeScreen(7); G.hurtFlash = 0.25;
  Sound.sfx('hurt');
  explode(p.x, p.y, ['#DA7756', '#FFF6EC', '#FFE14D'], 20, 100);
  if (p.lives <= 0) {
    p.dead = true; G.phase = 'dying'; G.phaseT = 0;
    explode(p.x, p.y, ['#DA7756', '#F29A77', '#FFFFFF', '#161616'], 50, 140);
    Sound.stop(); Sound.sfx('bigExplode');
    return;
  }
  p.inv = CONFIG.player.iframes;
  if (hadPower) addFloat('POWER DOWN', p.x, p.y - 18, '#FF8A8A');
}

// ---- Boss ----
function spawnBoss() {
  const def = BOSSES[COURSES[G.course].boss], spr = SPR.boss[def.sprite];
  const w = spr.w * def.scale, h = spr.h * def.scale;
  G.boss = {
    def, spr, x: W / 2, y: -h / 2, w, h, baseY: HUD_H + 34 + h / 2,
    hp: def.hp, maxHp: def.hp, t: 0, mt: 0, entering: true,
    patterns: def.patterns.slice(), patIdx: 0, patT: 0, fireT: 0.8, gap: 0, spin: 0,
    phase2: false, flash: 0, laser: null, slammed: false, shakeX: 0, dead: false, gone: false, fx: 0,
  };
}
function every(b, interval) {
  if (b.fireT <= 0) { b.fireT += interval; if (b.fireT < 0) b.fireT = interval; return true; }
  return false;
}
function bossShot(b, x, y, a, s, kind = 'round') {
  if (G.enemyBullets.length < 200) enemyShot(x, y, a, s, kind, b.def.bullet[0], b.def.bullet[1]);
}
function bossSummon(b) {
  const type = b.def.minion;
  if (G.enemies.filter((e) => e.minion && !e.dead).length >= 6) return;
  for (const s of [-1, 1]) {
    const x = clamp(b.x + s * b.w * 0.45, 16, W - 16), y = b.y;
    if (type === 'mini') spawnEnemy('mini', { mode: 'hop', x, y, vx: s * rand(30, 60), vy: -50, minion: true });
    else if (type === 'bird') spawnEnemy('bird', { mode: 'swoop', x, y, minion: true });
    else spawnEnemy(type, { mode: 'drift', x, y, minion: true });
  }
}
// Attack patterns: dur = duration, move:true = the pattern controls movement itself
const BOSS_PATTERNS = {
  aimed: { dur: 3.0, update(b, dt, k) {
    if (every(b, 0.55 * k.int)) { const y = b.y + b.h * 0.3, a = aimAt(b.x, y); for (let i = -1; i <= 1; i++) bossShot(b, b.x, y, a + i * 0.2, 95 * k.spd); }
  } },
  ring: { dur: 3.2, update(b, dt, k) {
    if (every(b, 0.85 * k.int)) { const n = 12 + G.course * 2; b.spin += 0.25; for (let i = 0; i < n; i++) bossShot(b, b.x, b.y, b.spin + (i * TAU) / n, 70 * k.spd); }
  } },
  spiral: { dur: 3.6, update(b, dt, k) {
    if (every(b, 0.075 * k.int)) { b.spin += 0.31; bossShot(b, b.x, b.y, b.spin, 78 * k.spd); bossShot(b, b.x, b.y, b.spin + Math.PI, 78 * k.spd); }
  } },
  fan: { dur: 3.0, update(b, dt, k) {
    if (every(b, 0.8 * k.int)) { const n = 7 + G.course; for (let i = 0; i < n; i++) bossShot(b, b.x, b.y + b.h * 0.3, Math.PI / 2 - 0.7 + (1.4 * i) / (n - 1), 88 * k.spd); }
  } },
  rain: { dur: 3.4, update(b, dt, k) {
    if (every(b, 0.1 * k.int)) bossShot(b, b.x + rand(-b.w / 2, b.w / 2), b.y + b.h * 0.3, Math.PI / 2 + rand(-0.35, 0.35), rand(55, 100) * k.spd, 'bubble');
  } },
  summon: { dur: 2.4, update(b, dt, k) {
    if (every(b, 1.1 * k.int)) bossSummon(b);
    if (b.patT > 0.5 && every(b, 0)) { /* no-op */ }
  } },
  charge: { dur: 3.0, move: true, update(b, dt, k) { // body slam
    const t = b.patT, p = G.player;
    if (t < 0.9) {
      if (!b.charging) { b.charging = true; Sound.sfx('charge'); }
      b.x += (p.x - b.x) * Math.min(1, dt * 3); b.y += (b.baseY - 10 - b.y) * Math.min(1, dt * 4); b.shakeX = Math.round(rand(-2, 2));
    } else if (t < 1.6) {
      b.shakeX = 0;
      b.y += 320 * k.spd * dt;
      if (b.y > H - 90) {
        b.y = H - 90;
        if (!b.slammed) { b.slammed = true; shakeScreen(6); Sound.sfx('explode'); const n = 10 + G.course * 2; for (let i = 0; i < n; i++) bossShot(b, b.x, b.y, (i * TAU) / n, 75 * k.spd); }
      }
    } else b.y += (b.baseY - b.y) * Math.min(1, dt * 2.5);
  } },
  laser: { dur: 3.0, move: true, update(b, dt, k) { // aim, then fire a vertical laser
    const t = b.patT, p = G.player;
    if (t < 1.1) {
      b.x += (p.x - b.x) * Math.min(1, dt * 2.2);
      b.y += (b.baseY - b.y) * Math.min(1, dt * 2);
      b.laser = { x: b.x, state: 'warn' };
    } else if (t < 2.0) {
      if (!b.laser || b.laser.state !== 'fire') { b.laser = { x: b.x, state: 'fire' }; Sound.sfx('beam'); shakeScreen(3); }
      if (Math.abs(p.x - b.laser.x) < 9) hurtPlayer();
    } else b.laser = null;
  } },
};
function moveBoss(b, dt) {
  b.mt += dt;
  const tx = W / 2 + Math.sin(b.mt * b.def.moveFreq) * b.def.moveAmp;
  b.x += (tx - b.x) * Math.min(1, dt * 2);
  b.y += (b.baseY + Math.sin(b.mt * 1.7) * 6 - b.y) * Math.min(1, dt * 2);
}
function updateBoss(dt) {
  const b = G.boss;
  if (!b || b.dead) return;
  b.t += dt;
  if (b.flash > 0) b.flash -= dt;
  if (b.entering) {
    b.y += 45 * dt;
    if (b.y >= b.baseY) { b.y = b.baseY; b.entering = false; b.patT = 0; b.fireT = 0.6; }
    return;
  }
  const k = { int: (b.phase2 ? 0.62 : 1) / (1 + G.course * 0.06), spd: 1 + G.course * 0.07 + (b.phase2 ? 0.1 : 0) };
  if (b.gap > 0) { b.gap -= dt; moveBoss(b, dt); return; }
  const pat = BOSS_PATTERNS[b.patterns[b.patIdx]];
  b.patT += dt; b.fireT -= dt;
  if (!pat.move) moveBoss(b, dt);
  pat.update(b, dt, k);
  if (b.patT >= pat.dur) {
    b.laser = null; b.gap = 0.7 * k.int; b.shakeX = 0; b.slammed = false; b.charging = false;
    b.patIdx = (b.patIdx + 1) % b.patterns.length; b.patT = 0; b.fireT = 0.25;
  }
}
function damageBoss(b, dmg) {
  if (b.entering || b.dead) return;
  b.hp -= dmg; b.flash = 0.06;
  addScore(10);
  Sound.sfx('hit');
  if (b.hp <= 0) { bossKilled(b); return; }
  if (!b.phase2 && b.hp <= b.maxHp / 2) {
    b.phase2 = true;
    b.patterns = b.patterns.concat(b.def.phase2);
    addFloat('ANGRY!!', b.x, b.y + b.h / 2 + 6, '#FF6A6A');
    shakeScreen(5);
  }
}
function bossKilled(b) {
  b.dead = true; b.hp = 0; b.laser = null; b.fx = 0;
  G.phase = 'bossDead'; G.phaseT = 0;
  addScore(CONFIG.scoring.bossBase * (G.course + 1));
  addFloat('BOSS BONUS ' + CONFIG.scoring.bossBase * (G.course + 1), W / 2, b.y + b.h / 2 + 8, '#FFE14D');
  for (const eb of G.enemyBullets) sparkle(eb.x, eb.y, ['#FFFFFF', '#FFE14D'], 2, 30);
  G.enemyBullets = [];
  for (const e of G.enemies) if (!e.dead) killEnemy(e, true);
  Sound.stop(); Sound.sfx('bigExplode');
  shakeScreen(10); G.flashT = 0.3;
}
function updateBossDeath(dt) {
  const b = G.boss;
  if (!b) return;
  b.fx -= dt;
  if (b.fx <= 0 && G.phaseT < 1.8) {
    b.fx = 0.12;
    explode(b.x + rand(-b.w / 2, b.w / 2), b.y + rand(-b.h / 2, b.h / 2), b.def.colors.concat('#FFFFFF'), 12, 80);
    Sound.sfx('explode'); shakeScreen(4);
  }
  if (G.phaseT >= 1.8 && !b.gone) {
    b.gone = true;
    explode(b.x, b.y, b.def.colors.concat(['#FFFFFF', '#FFE14D']), 70, 160);
    sparkle(b.x, b.y, ['#FFFFFF', '#FFE14D'], 30, 120);
    shakeScreen(10); G.flashT = 0.4;
    Sound.sfx('bigExplode');
  }
}

// ---- Collision checks ----
function collide() {
  const p = G.player, B = G.boss;
  // player bullets → enemies / boss
  for (const b of G.bullets) {
    if (b.dead) continue;
    for (const e of G.enemies) {
      if (e.dead || e.gone) continue;
      const T = ENEMY_TYPES[e.type];
      if (Math.abs(b.x - e.x) < T.w / 2 + b.w / 2 && Math.abs(b.y - e.y) < T.h / 2 + b.h / 2) {
        if (b.pierce) { if (b.hit.has(e)) continue; b.hit.add(e); } else b.dead = true;
        damageEnemy(e, b.dmg);
        if (!b.pierce) break;
      }
    }
    if (!b.dead && B && G.phase === 'boss' && !B.entering && !B.dead) {
      if (Math.abs(b.x - B.x) < B.w * 0.4 && Math.abs(b.y - B.y) < B.h * 0.42) {
        if (b.pierce) { if (!b.hit.has(B)) { b.hit.add(B); damageBoss(B, b.dmg); } }
        else { b.dead = true; damageBoss(B, b.dmg); if (Math.random() < 0.5) sparkle(b.x, b.y, ['#FFFFFF', '#FFE14D'], 2, 40); }
      }
    }
  }
  if (p.dead) return;
  const hw = CONFIG.player.hitbox.w / 2, hh = CONFIG.player.hitbox.h / 2, py = p.y + 1;
  // enemy bullets → player
  for (const eb of G.enemyBullets) {
    if (Math.abs(eb.x - p.x) < hw + eb.r - 1 && Math.abs(eb.y - py) < hh + eb.r - 1) {
      if (p.star > 0) { eb.dead = true; sparkle(eb.x, eb.y, ['#FFFFFF', '#FFE14D'], 3, 40); }
      else if (p.inv <= 0) { eb.dead = true; hurtPlayer(); }
    }
  }
  // enemy body → player
  for (const e of G.enemies) {
    if (e.dead || e.gone) continue;
    const T = ENEMY_TYPES[e.type];
    if (Math.abs(e.x - p.x) < T.w / 2 + hw - 1 && Math.abs(e.y - py) < T.h / 2 + hh - 1) {
      if (p.star > 0) damageEnemy(e, 5);
      else if (p.inv <= 0) { hurtPlayer(); damageEnemy(e, 2); }
    }
  }
  // boss body → player
  if (B && !B.dead && !B.entering && Math.abs(B.x - p.x) < B.w * 0.4 + hw && Math.abs(B.y - py) < B.h * 0.4 + hh) hurtPlayer();
  // items
  for (const it of G.items) {
    if (!it.dead && Math.abs(it.x - p.x) < 13 && Math.abs(it.y - p.y) < 13) { it.dead = true; applyItem(it); }
  }
}

// ---- Per-state updates ----
function updatePlay(dt) {
  G.phaseT += dt;
  const p = G.player;
  if (!p.dead) updatePlayer(dt);
  switch (G.phase) {
    case 'intro':
      if (G.phaseT > 2.6) { G.phase = 'wave'; G.phaseT = 0; startWave(); }
      break;
    case 'wave':
      G.waveT += dt;
      for (let i = G.spawnQueue.length - 1; i >= 0; i--) {
        if (G.spawnQueue[i].at <= G.waveT) { spawnFlyer(G.spawnQueue[i].type); G.spawnQueue.splice(i, 1); }
      }
      updateDives(dt);
      if (G.spawnQueue.length === 0 && G.enemies.length === 0) { G.phase = 'waveGap'; G.phaseT = 0; }
      break;
    case 'waveGap':
      if (G.phaseT > 1.3) {
        G.wave++;
        if (G.wave < COURSES[G.course].waves.length) { G.phase = 'wave'; G.phaseT = 0; startWave(); }
        else { G.phase = 'warning'; G.phaseT = 0; Sound.stop(); Sound.sfx('warning'); }
      }
      break;
    case 'warning':
      if (G.phaseT > 2.8) { G.phase = 'boss'; G.phaseT = 0; spawnBoss(); Sound.play('boss'); }
      break;
    case 'bossDead':
      updateBossDeath(dt);
      if (G.phaseT > 3.0) { G.boss = null; enterClear(); return; }
      break;
    case 'dying':
      if (G.phaseT > 2.2) { enterGameOver(); return; }
      break;
  }
  updateFormation(dt);
  for (const e of G.enemies) updateEnemy(e, dt);
  updateBoss(dt);
  // bullets
  for (const b of G.bullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -20 || b.x < -10 || b.x > W + 10) b.dead = true; }
  for (const eb of G.enemyBullets) { eb.t += dt; eb.x += eb.vx * dt; eb.y += eb.vy * dt; if (eb.y > H + 8 || eb.y < -20 || eb.x < -8 || eb.x > W + 8) eb.dead = true; }
  // items
  for (const it of G.items) { it.t += dt; it.y += CONFIG.items.fallSpeed * dt; it.x = clamp(it.x + Math.sin(it.t * 3) * 12 * dt, 8, W - 8); if (it.y > H + 10) it.dead = true; }
  collide();
  G.bullets = G.bullets.filter((b) => !b.dead);
  G.enemyBullets = G.enemyBullets.filter((b) => !b.dead);
  G.enemies = G.enemies.filter((e) => !e.dead && !e.gone);
  G.items = G.items.filter((i) => !i.dead);
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
}
function updateClear(dt) {
  const T = G.tally;
  T.t += dt;
  if (T.shown < T.lines.length && T.t > 1.0 + T.shown * 0.7) {
    addScore(T.lines[T.shown].value, true);
    T.shown++;
    Sound.sfx('tally');
    if (T.shown === T.lines.length) T.doneAt = T.t;
  }
  if (T.doneAt !== null && T.t - T.doneAt > 5) nextCourse();
  // allow moving (no shooting) during the tally
  const p = G.player;
  let dir = (Input.left() ? -1 : 0) + (Input.right() ? 1 : 0);
  p.x = clamp(p.x + dir * CONFIG.player.speeds[p.speedLv] * dt, 12, W - 12);
  p.moving = dir !== 0; p.anim += dt;
}
function updateAllClear(dt) {
  G.fireworkT -= dt;
  if (G.fireworkT <= 0) {
    G.fireworkT = rand(0.2, 0.5);
    const cols = pick([['#FF5A5A', '#FFE14D'], ['#4FC3FF', '#FFFFFF'], ['#7CFF6B', '#FFE14D'], ['#FF8CC6', '#B07CFF']]);
    explode(rand(30, W - 30), rand(60, 220), cols, 26, 90);
    Sound.sfx('explode');
  }
}
function updateParticles(dt) {
  for (const p of G.particles) {
    p.life -= dt;
    if (p.kind === 'ring') { p.r += p.vr * dt; continue; }
    const k = Math.max(0, 1 - (p.drag || 0) * dt);
    p.vx *= k; p.vy *= k;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  G.particles = G.particles.filter((p) => p.life > 0);
  for (const f of G.floats) { f.life -= dt; f.y -= 18 * dt; }
  G.floats = G.floats.filter((f) => f.life > 0);
}

function update(dt) {
  if (G.state === 'play' && G.paused) return;
  G.time += dt;
  G.stateT += dt;
  updateBackground(dt);
  switch (G.state) {
    case 'play': updatePlay(dt); break;
    case 'clear': updateClear(dt); break;
    case 'allclear': updateAllClear(dt); break;
  }
  updateParticles(dt);
  G.shake = Math.max(0, G.shake - dt * 20);
  if (G.flashT > 0) G.flashT -= dt;
  if (G.hurtFlash > 0) G.hurtFlash -= dt;
}

// =====================================================================
// 9. Drawing
// =====================================================================
function drawBackground() {
  ctx.drawImage(BG.sky, 0, 0);
  for (const layer of BG.layers) {
    const L = layer.L;
    for (const it of layer.items) {
      const x = Math.round(it.x), y = Math.round(it.y);
      ctx.fillStyle = it.c;
      switch (L.kind) {
        case 'dot': if (Math.sin(G.time * 3 + it.ph) > -0.5) ctx.fillRect(x, y, 1, 1); break;
        case 'star': {
          const on = Math.sin(G.time * 4 + it.ph);
          ctx.fillRect(x, y, 1, 1);
          if (on > 0) { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }
          if (on > 0.8) { ctx.fillRect(x - 2, y, 5, 1); ctx.fillRect(x, y - 2, 1, 5); }
          break;
        }
        case 'streak': ctx.fillRect(x, y, 1, it.size); break;
        case 'cloud': {
          const w = it.size;
          ctx.fillRect(x, y, w, 3); ctx.fillRect(x + 2, y - 2, w - 5, 2); ctx.fillRect(x + Math.round(w * 0.3), y - 4, Math.round(w * 0.35), 2);
          break;
        }
        case 'flower': ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); ctx.fillStyle = '#FF9F1C'; ctx.fillRect(x, y, 1, 1); break;
        case 'grass': ctx.fillRect(x, y - 2, 1, 3); ctx.fillRect(x - 2, y - 1, 1, 2); ctx.fillRect(x + 2, y - 1, 1, 2); break;
        case 'bubble': pixelRing(x, y, it.size + 1, it.c); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x - 1, y - 1, 1, 1); break;
        case 'wave': ctx.fillRect(x, y, it.size, 1); ctx.fillRect(x + 2, y - 1, Math.max(1, it.size - 4), 1); break;
        case 'planet': {
          pixelDisc(x, y, it.size, it.c);
          pixelDisc(x - Math.round(it.size / 3), y - Math.round(it.size / 3), Math.round(it.size / 2.2), mix(it.c, '#FFFFFF', 0.25));
          ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(x - it.size - 5, y + 1, it.size * 2 + 11, 1);
          break;
        }
        case 'sprinkle': if (it.ph > Math.PI) ctx.fillRect(x, y, 3, 1); else ctx.fillRect(x, y, 1, 3); break;
        case 'heart': ctx.fillRect(x, y, 2, 1); ctx.fillRect(x + 3, y, 2, 1); ctx.fillRect(x, y + 1, 5, 1); ctx.fillRect(x + 1, y + 2, 3, 1); ctx.fillRect(x + 2, y + 3, 1, 1); break;
        case 'candy': pixelDisc(x, y, 3, it.c); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x - 2, y - 1, 2, 1); ctx.fillRect(x + 1, y + 1, 2, 1); break;
      }
    }
  }
}

function drawPlayer() {
  const p = G.player;
  if (!p || p.dead) return;
  if (p.inv > 0 && Math.floor(G.time * 16) % 2 === 0) return; // blink while invincible after a hit
  const frame = p.moving ? Math.floor(p.anim * 8) % 2 : 0;
  if (p.star > 0 && (p.star > 1.5 || Math.floor(G.time * 10) % 2 === 0)) drawSprite(SPR.playerRainbow[Math.floor(G.time * 14) % 6], frame, p.x, p.y);
  else drawSprite(SPR.player, frame, p.x, p.y);
  if (p.shield) {
    const rot = Math.floor(G.time * 20);
    pixelRing(p.x, p.y, 15, Math.floor(G.time * 8) % 2 ? '#7FDBFF' : '#FFFFFF', (i) => (i + rot) % 5 === 0);
  }
}
function drawEnemies() {
  for (const e of G.enemies) {
    const spr = SPR.enemy[e.type];
    drawSprite(spr, Math.floor(G.time * 4 + e.anim), e.x, e.y, 1, e.flash > 0);
  }
}
function drawBoss() {
  const b = G.boss;
  if (!b || b.gone) return;
  if (b.laser) {
    const lx = Math.round(b.laser.x), top = Math.round(b.y + b.h * 0.3);
    if (b.laser.state === 'warn') {
      if (Math.floor(G.time * 12) % 2) { ctx.fillStyle = 'rgba(255,60,60,0.8)'; ctx.fillRect(lx, top, 1, H - top); }
    } else {
      const wob = Math.floor(G.time * 30) % 2;
      ctx.fillStyle = b.def.bullet[0]; ctx.fillRect(lx - 7 - wob, top, 15 + wob * 2, H - top);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(lx - 3, top, 7, H - top);
    }
  }
  if (b.dead && Math.floor(G.time * 20) % 2) return;
  drawSprite(b.spr, 0, b.x + b.shakeX, b.y, b.def.scale, b.flash > 0);
}
function drawBullets() {
  for (const b of G.bullets) {
    const x = Math.round(b.x - b.w / 2), y = Math.round(b.y - b.h / 2);
    if (b.kind === 'laser') {
      ctx.fillStyle = '#4FE0FF'; ctx.fillRect(x - 1, y, b.w + 2, b.h);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x, y, b.w, b.h);
    } else {
      ctx.fillStyle = '#FFB000'; ctx.fillRect(x, y, b.w, b.h);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x, y, b.w, 3);
    }
  }
  for (const eb of G.enemyBullets) {
    const frames = bulletSprite(eb.kind, eb.c1, eb.c2);
    ctx.drawImage(frames[Math.floor(eb.t * 10) % 2], Math.round(eb.x) - 3, Math.round(eb.y) - 3);
  }
}
function drawItems() {
  for (const it of G.items) {
    const x = Math.round(it.x) - 5, y = Math.round(it.y) - 5;
    ctx.drawImage(SPR.item[it.type], x, y);
    if (Math.floor(G.time * 6) % 3 === 0) { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x + 9, y - 1, 1, 3); ctx.fillRect(x + 8, y, 3, 1); } // twinkle
  }
}
function drawParticles() {
  for (const p of G.particles) {
    const a = p.life / p.max;
    if (p.kind === 'sq') {
      ctx.fillStyle = p.color;
      const s = a < 0.35 ? 1 : p.size;
      ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    } else if (p.kind === 'spark') {
      if (Math.floor(p.life * 20) % 2) continue;
      ctx.fillStyle = p.color;
      const x = Math.round(p.x), y = Math.round(p.y);
      ctx.fillRect(x, y, 1, 1);
      if (a > 0.5) { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }
    } else if (p.kind === 'ring') {
      pixelRing(p.x, p.y, Math.round(p.r), p.color);
    }
  }
  for (const f of G.floats) {
    if (f.life < 0.3 && Math.floor(f.life * 20) % 2) continue;
    drawText(f.text, f.x, f.y, f.color, { align: 'center' });
  }
}

function drawButton(r, icon, active) {
  ctx.fillStyle = OUTLINE; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = active ? '#3B2F6B' : '#2A2340'; ctx.fillRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
  ctx.drawImage(icon, Math.round(r.x + (r.w - icon.width) / 2), Math.round(r.y + (r.h - icon.height) / 2));
}
function drawPips(x, y, n, max, color) {
  for (let i = 0; i < max; i++) { ctx.fillStyle = i < n ? color : '#444455'; ctx.fillRect(x + i * 4, y + 1, 3, 3); }
}
function drawHUD() {
  const p = G.player;
  ctx.fillStyle = 'rgba(12,8,28,0.82)'; ctx.fillRect(0, 0, W, HUD_H);
  ctx.fillStyle = '#FFFFFF22'; ctx.fillRect(0, HUD_H, W, 1);
  drawText('SCORE', 3, 3, '#FFE14D');
  drawText(pad(G.score, 7), 37, 3, p && p.x2 > 0 ? '#D6B4FF' : '#FFFFFF');
  drawText('HI', 86, 3, '#FF8A5C');
  drawText(pad(G.hi, 7), 100, 3);
  drawText('C' + (G.course + 1) + '-' + (G.phase === 'boss' || G.phase === 'bossDead' || G.phase === 'warning' ? 'B' : Math.min(G.wave + 1, COURSES[Math.min(G.course, 4)].waves.length)), 152, 3, '#7FE7FF');
  if (p) {
    for (let i = 0; i < p.lives; i++) drawText('♥', 3 + i * 6, 12, '#FF5E7E', { shadow: false });
    drawText('PW', 44, 12, '#FF8A8A'); drawText(WEAPON_NAMES[p.weapon], 58, 12);
    drawText('RF', 100, 12, '#FFB347'); drawPips(114, 12, p.rapid, 3, '#FFB347');
    drawText('SP', 132, 12, '#6BE38B'); drawPips(146, 12, p.speedLv, 2, '#6BE38B');
    if (p.shield) drawText('SH', 160, 12, '#7FDBFF');
  }
  drawButton(BUTTONS.sound, Sound.isMuted() ? SPR.ui.soundOff : SPR.ui.soundOn, !Sound.isMuted());
  if (G.state === 'play') drawButton(BUTTONS.pause, G.paused ? SPR.ui.play : SPR.ui.pause, G.paused);
  // bottom status (time-limited effects)
  if (p) {
    let x = 4;
    if (p.x2 > 0) { drawText('SCORE X2 ' + Math.ceil(p.x2), x, H - 9, '#D6B4FF'); x += 70; }
    if (p.star > 0) drawText('INVINCIBLE ' + Math.ceil(p.star), x, H - 9, ['#FF5A5A', '#FFE14D', '#6BE36B', '#4FC3FF'][Math.floor(G.time * 10) % 4]);
  }
}
function drawBossBar() {
  const b = G.boss;
  if (!b || b.gone) return;
  drawText(b.def.name, 6, HUD_H + 3, '#FFFFFF');
  const x = 6, y = HUD_H + 11, w = W - 12;
  ctx.fillStyle = OUTLINE; ctx.fillRect(x - 1, y - 1, w + 2, 6);
  ctx.fillStyle = '#442233'; ctx.fillRect(x, y, w, 4);
  const r = clamp(b.hp / b.maxHp, 0, 1);
  ctx.fillStyle = r < 0.5 ? (Math.floor(G.time * 8) % 2 ? '#FF4040' : '#FF8A3D') : '#FFD23F';
  ctx.fillRect(x, y, Math.round(w * r), 4);
  ctx.fillStyle = '#FFFFFF55'; ctx.fillRect(x, y, Math.round(w * r), 1);
}
function panel(x, y, w, h) {
  ctx.fillStyle = OUTLINE; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#2A2350'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x + 2, y + 2, w - 4, 1); ctx.fillRect(x + 2, y + h - 3, w - 4, 1);
}
const startLabel = () => (isTouch ? 'TAP TO START' : 'PRESS START');

function drawPlayOverlays() {
  const C = COURSES[G.course];
  if (G.phase === 'intro') {
    const t = G.phaseT, slide = Math.round((1 - Math.min(1, t / 0.4)) * W);
    ctx.fillStyle = 'rgba(12,8,28,0.6)'; ctx.fillRect(0, 140, W, 64);
    drawText('COURSE ' + (G.course + 1), W / 2 + slide, 152, '#FFE14D', { scale: 3, align: 'center', shadowColor: '#8A2BE2' });
    drawText(C.name, W / 2 - slide, 176, '#FFFFFF', { align: 'center' });
    if (t > 1.0 && Math.floor(t * 4) % 2 === 0) drawText('READY!', W / 2, 190, '#7FE7FF', { align: 'center' });
  }
  if (G.banner && G.phase === 'wave') drawText(G.banner.text, W / 2, 150, '#FFFFFF', { scale: 2, align: 'center', shadowColor: '#3A0CA3' });
  if (G.phase === 'warning') {
    const on = Math.floor(G.phaseT * 4) % 2 === 0;
    ctx.fillStyle = 'rgba(255,0,40,' + (0.12 + 0.1 * Math.sin(G.phaseT * 10)) + ')'; ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.fillStyle = 'rgba(40,0,0,0.75)'; ctx.fillRect(0, 150, W, 44);
    ctx.fillStyle = '#FF3040';
    for (let x = -20 + Math.floor(G.phaseT * 40) % 12; x < W; x += 12) { ctx.fillRect(x, 150, 6, 3); ctx.fillRect(x + 6, 191, 6, 3); }
    if (on) drawText('WARNING!!', W / 2, 160, '#FF4050', { scale: 3, align: 'center' });
    drawText('BOSS APPROACHING', W / 2, 181, '#FFD0D0', { align: 'center' });
  }
  if (G.phase === 'boss' || G.phase === 'bossDead') drawBossBar();
  if (G.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, HUD_H, W, H - HUD_H);
    drawText('PAUSE', W / 2, 170, '#FFFFFF', { scale: 3, align: 'center' });
    drawText(isTouch ? 'TAP TO RESUME' : 'P: RESUME   M: SOUND', W / 2, 196, '#FFE14D', { align: 'center' });
  }
}
function drawClear() {
  const T = G.tally;
  panel(14, 110, W - 28, 160);
  drawText('COURSE ' + (G.course + 1) + ' CLEAR!', W / 2, 124, '#FFE14D', { scale: 2, align: 'center', shadowColor: '#8A2BE2' });
  T.lines.forEach((L, i) => {
    if (i >= T.shown) return;
    const y = 156 + i * 18;
    drawText(L.label, 26, y, '#7FE7FF');
    drawText(L.detail, 86, y, '#FFFFFF');
    drawText(String(L.value), W - 26, y, '#FFE14D', { align: 'right' });
  });
  if (T.doneAt !== null) {
    drawText('SCORE', 26, 218, '#FF8A5C');
    drawText(pad(G.score, 7), W - 26, 218, '#FFFFFF', { align: 'right', scale: 1 });
    if (Math.floor(G.time * 2.5) % 2 === 0) drawText(G.course + 1 < COURSES.length ? (isTouch ? 'TAP: NEXT COURSE' : 'PRESS START: NEXT') : (isTouch ? 'TAP TO CONTINUE' : 'PRESS START'), W / 2, 246, '#FFFFFF', { align: 'center' });
  }
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, HUD_H, W, H - HUD_H);
  const drop = Math.round(Math.max(0, 1 - G.stateT / 0.6) * -80);
  drawText('GAME OVER', W / 2, 140 + drop, '#FF5A5A', { scale: 3, align: 'center', shadowColor: '#3A0000' });
  drawText('SCORE ' + pad(G.score, 7), W / 2, 180, '#FFFFFF', { align: 'center' });
  drawText('HI    ' + pad(G.hi, 7), W / 2, 192, '#FFE14D', { align: 'center' });
  if (G.newRecord && Math.floor(G.time * 4) % 2) drawText('NEW RECORD!', W / 2, 212, '#7FFF9F', { align: 'center' });
  if (G.stateT > 1.2) {
    const opt = (r, label, sel) => {
      ctx.fillStyle = sel ? '#FFE14D' : OUTLINE; ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = sel ? '#5B2A6E' : '#2A2350'; ctx.fillRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
      drawText((sel ? '> ' : '') + label, r.x + r.w / 2, r.y + 5, sel ? '#FFFFFF' : '#AAAACC', { align: 'center' });
    };
    opt(BUTTONS.cont, 'CONTINUE', G.menuSel === 0);
    opt(BUTTONS.title, 'TITLE', G.menuSel === 1);
    drawText('CONTINUE: RETRY THIS COURSE', W / 2, 298, '#AAAACC', { align: 'center' });
    drawText('(SCORE RESETS)', W / 2, 308, '#AAAACC', { align: 'center' });
  }
}
function drawTitle() {
  const t = G.time, bob = Math.round(Math.sin(t * 2) * 2);
  drawText('PIXEL BUDDY', W / 2, 46 + bob, '#FFE14D', { scale: 3, align: 'center', shadowColor: '#8A2BE2' });
  drawText('BLASTER', W / 2, 68 + bob, '#FF8A5C', { scale: 3, align: 'center', shadowColor: '#3A0CA3' });
  // character
  const jump = Math.round(Math.abs(Math.sin(t * 3)) * 10);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(W / 2 - 36 + jump, 200, 72 - jump * 2, 3);
  drawSprite(SPR.player, Math.floor(t * 4) % 2, W / 2, 162 - jump, 4);
  if (Math.floor(t * 2.5) % 2 === 0) drawText(startLabel(), W / 2, 226, '#FFFFFF', { scale: 2, align: 'center', shadowColor: '#3A0CA3' });
  drawText('HI-SCORE ' + pad(G.hi, 7), W / 2, 254, '#FFE14D', { align: 'center' });
  const help = isTouch
    ? ['HOLD LEFT / RIGHT: MOVE', 'DRAG: MOVE   AUTO FIRE', 'TOP RIGHT: SOUND / PAUSE']
    : ['MOVE: ARROW KEYS / A D', 'SHOT: SPACE   PAUSE: P', 'SOUND ON/OFF: M'];
  help.forEach((s, i) => drawText(s, W / 2, 280 + i * 11, '#C8C0FF', { align: 'center' }));
  // enemy parade
  const names = ['jelly', 'bird', 'rock', 'eye', 'slime'];
  names.forEach((n, i) => {
    const x = ((t * 28 + i * 44) % (W + 50)) - 25;
    drawSprite(SPR.enemy[n], Math.floor(t * 4 + i), x, 362 + Math.round(Math.sin(t * 4 + i) * 2));
  });
  drawText('(C) 8-BIT FUN', W / 2, H - 12, '#665F99', { align: 'center', shadow: false });
  drawButton(BUTTONS.sound, Sound.isMuted() ? SPR.ui.soundOff : SPR.ui.soundOn, !Sound.isMuted());
}
function drawAllClear() {
  const t = G.stateT;
  drawText('ALL CLEAR!', W / 2, 50, ['#FFE14D', '#FF8CC6', '#7FE7FF', '#7CFF6B'][Math.floor(t * 6) % 4], { scale: 3, align: 'center', shadowColor: '#3A0CA3' });
  drawText('CONGRATULATIONS!', W / 2, 80, '#FFFFFF', { align: 'center' });
  const jump = Math.round(Math.abs(Math.sin(t * 5)) * 16);
  const spr = Math.floor(t * 2) % 2 ? SPR.playerRainbow[Math.floor(t * 12) % 6] : SPR.player;
  drawSprite(spr, Math.floor(t * 6) % 2, W / 2, 160 - jump, 4);
  panel(30, 222, W - 60, 60);
  drawText('FINAL SCORE', W / 2, 232, '#7FE7FF', { align: 'center' });
  drawText(pad(G.score, 7), W / 2, 244, '#FFFFFF', { scale: 2, align: 'center' });
  drawText('HI ' + pad(G.hi, 7), W / 2, 266, '#FFE14D', { align: 'center' });
  if (G.newRecord && Math.floor(G.time * 4) % 2) drawText('NEW RECORD!', W / 2, 294, '#7FFF9F', { align: 'center' });
  if (t > 2 && Math.floor(G.time * 2.5) % 2 === 0) drawText(isTouch ? 'TAP TO TITLE' : 'PRESS START', W / 2, 320, '#FFFFFF', { align: 'center' });
  drawText('THANK YOU FOR PLAYING!', W / 2, 350, '#C8C0FF', { align: 'center' });
  drawButton(BUTTONS.sound, Sound.isMuted() ? SPR.ui.soundOff : SPR.ui.soundOn, !Sound.isMuted());
}

function draw() {
  ctx.save();
  if (G.shake > 0 && !G.paused) ctx.translate(Math.round(rand(-1, 1) * G.shake * 0.5), Math.round(rand(-1, 1) * G.shake * 0.5));
  drawBackground();
  if (G.state === 'play' || G.state === 'clear' || G.state === 'gameover') {
    drawItems();
    drawEnemies();
    drawBoss();
    drawBullets();
    drawPlayer();
  }
  drawParticles();
  ctx.restore();
  if (G.flashT > 0) { ctx.fillStyle = 'rgba(255,255,255,' + clamp(G.flashT / 0.35, 0, 1) * 0.75 + ')'; ctx.fillRect(0, 0, W, H); }
  if (G.hurtFlash > 0) { ctx.fillStyle = 'rgba(255,0,0,' + clamp(G.hurtFlash / 0.25, 0, 1) * 0.35 + ')'; ctx.fillRect(0, 0, W, H); }
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'play': drawHUD(); drawPlayOverlays(); break;
    case 'clear': drawHUD(); drawClear(); break;
    case 'gameover': drawHUD(); drawGameOver(); break;
    case 'allclear': drawAllClear(); break;
  }
}

// =====================================================================
// 10. Main loop (requestAnimationFrame + delta time)
// =====================================================================
let lastTime = performance.now();
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 1 / 20) dt = 1 / 20; // cap large gaps (tab switches, etc.)
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

bakeAll();
resize();
toTitle();
requestAnimationFrame(frame);
</script>
